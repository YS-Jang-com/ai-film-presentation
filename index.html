<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>AI Film Preproduction</title>
  <link rel="stylesheet" href="./style.css">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Syne:wght@400;500;600;700;800&family=Inter:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
</head>
<body>

  <!-- Page Navigation Buttons -->
  <div class="color-controls">
    <button class="color-btn active" data-scheme="1" data-page="1">Page 1</button>
    <button class="color-btn" data-scheme="2" data-page="2">Page 2</button>
    <button class="color-btn" data-scheme="3" data-page="3">Page 3</button>
    <button class="color-btn" data-scheme="4" data-page="4">Page 4</button>
    <button class="color-btn" data-scheme="5" data-page="5">Page 5</button>
    <button class="color-btn" data-scheme="1" data-page="6">Page 6</button>
    <button class="color-btn" data-scheme="2" data-page="7">Page 7</button>
    <button class="color-btn" data-scheme="3" data-page="8">Page 8</button>
    <button class="color-btn" data-scheme="4" data-page="9">Page 9</button>
    <button class="color-btn" data-scheme="5" data-page="10">Page 10</button>
    <button class="color-btn" data-scheme="1" data-page="11">Page 11</button>
    <button class="color-btn" data-scheme="2" data-page="12">Page 12</button>
    <button class="color-btn" data-scheme="3" data-page="13">Page 13</button>
    <button class="color-btn" data-scheme="4" data-page="14">Page 14</button>
  </div>

  <!-- Page Content Overlay -->
  <div class="page-content-overlay">
    <div class="page-content-box" id="pageContentBox"></div>
  </div>

  <!-- Footer -->
  <footer class="footer">
    <a href="#" target="_blank" rel="noopener noreferrer">YS JANG</a>
  </footer>

  <!-- Custom cursor -->
  <div class="custom-cursor" id="customCursor"></div>

  <!-- Three.js + App -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
  <script src="./script.js"></script>

</body>
</html>
